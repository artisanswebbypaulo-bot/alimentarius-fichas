<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fichas Técnicas de Receitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F3EE;
    --paper-raised:#FFFFFF;
    --paper-2:#E7EAE2;
    --ink:#1E2A28;
    --ink-soft:#57655F;
    --ink-faint:#8A968F;
    --line:#C9CFC3;
    --line-strong:#9FAB9F;
    --brand:#008DD2;
    --brand-ink:#00668F;
    --brand-soft:#DCF0FA;
    --accent:#EA831A;
    --accent-ink:#B4630F;
    --accent-soft:#FCE9D4;
    --status-ok:#2E7D46;      --status-ok-bg:#E4F1E7;
    --status-warn:#B8792A;    --status-warn-bg:#F6EBDA;
    --status-bad:#A13A2A;     --status-bad-bg:#F5E1DC;
    --status-danger:#6E1616;  --status-danger-bg:#EFD6D6;
    --font-serif:'Fraunces', serif;
    --font-sans:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-sans);
    font-size:14.5px;
    line-height:1.5;
  }
  a{ color:var(--brand-ink); }
  button{ font-family:var(--font-sans); cursor:pointer; }
  input,select,textarea{ font-family:var(--font-sans); font-size:14.5px; color:var(--ink); }

  #app{ display:flex; min-height:100vh; align-items:stretch; }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:250px; flex:none;
    background:var(--paper-2);
    border-right:1px solid var(--line);
    padding:22px 18px 18px;
    display:flex; flex-direction:column;
  }
  .brand{
    font-family:var(--font-serif); font-weight:600; font-size:19px;
    color:var(--brand-ink); letter-spacing:.2px; margin-bottom:3px;
  }
  .brand-sub{ color:var(--ink-soft); font-size:12.5px; margin-bottom:20px; }

  nav.steps{ display:flex; flex-direction:column; gap:2px; margin-bottom:22px; }
  .step-btn{
    display:flex; align-items:baseline; gap:10px;
    background:none; border:none; text-align:left;
    padding:8px 8px; border-radius:4px; color:var(--ink-soft);
  }
  .step-btn .num{ font-family:var(--font-serif); font-size:15px; color:var(--ink-faint); width:14px; }
  .step-btn.active{ background:var(--brand-soft); color:var(--brand-ink); }
  .step-btn.active .num{ color:var(--brand-ink); }
  .step-btn:hover:not(.active){ background:#DEE2D8; }

  .sidebar-divider{ border:none; border-top:1px solid var(--line); margin:8px 0 14px; }

  .sidebar-actions{ display:flex; gap:8px; margin-bottom:14px; }
  .btn{
    font-size:13px; padding:7px 12px; border-radius:4px;
    border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink);
  }
  .btn:hover{ border-color:var(--brand); color:var(--brand-ink); }
  .btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.primary:hover{ background:var(--brand-ink); }
  .btn.danger{ border-color:var(--status-bad); color:var(--status-bad); }
  .btn.danger:hover{ background:var(--status-bad-bg); }
  .btn.small{ padding:4px 8px; font-size:12px; }
  .btn.block{ width:100%; }

  .saved-list-title{ font-size:11.5px; color:var(--ink-faint); margin:4px 0 8px; }

  .prof-section{ border:1px solid var(--line); border-radius:5px; margin-bottom:8px; overflow:hidden; }
  .prof-section-header{
    width:100%; text-align:left; background:var(--paper-2); border:none;
    padding:10px 14px; font-size:13.3px; font-weight:600; color:var(--ink);
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    font-family:var(--font-sans);
  }
  .prof-section-header:hover{ background:#DEE2D8; }
  .prof-section-chevron{ color:var(--ink-faint); transition:transform .15s; font-size:12px; }
  .prof-section.open .prof-section-chevron{ transform:rotate(90deg); }
  .prof-section-body{ padding:14px; border-top:1px solid var(--line); }
  .saved-list{ display:flex; flex-direction:column; gap:4px; overflow-y:auto; }
  .saved-item{
    display:flex; justify-content:space-between; align-items:center; gap:6px;
    padding:7px 8px; border-radius:4px; font-size:12.8px; color:var(--ink-soft);
  }
  .saved-item:hover{ background:#DEE2D8; }
  .saved-item.current{ background:var(--brand-soft); color:var(--brand-ink); }
  .saved-item button{ background:none; border:none; color:var(--ink-faint); font-size:13px; padding:2px 4px; }
  .saved-item button:hover{ color:var(--status-bad); }
  .saved-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; text-align:left; background:none; border:none; color:inherit; font-size:inherit; padding:0; }

  .storage-note{ margin-top:auto; padding-top:12px; font-size:11px; color:var(--ink-faint); border-top:1px solid var(--line); }

  /* ---------- Main ---------- */
  #main{ flex:1; min-width:0; padding:30px 46px 60px; max-width:900px; }

  .doc-title-row{ display:flex; align-items:flex-end; gap:18px; margin-bottom:4px; flex-wrap:wrap; }
  #recipe-name{
    font-family:var(--font-serif); font-weight:600; font-size:32px; color:var(--ink);
    border:none; background:none; padding:2px 0; flex:1; min-width:220px;
  }
  #recipe-name:focus{ outline:none; border-bottom:1.5px solid var(--brand); }
  #recipe-name::placeholder{ color:var(--ink-faint); }

  .doc-meta{ display:flex; flex-wrap:wrap; gap:18px; color:var(--ink-soft); font-size:13px; margin:10px 0 24px; }
  .doc-meta .field{ display:flex; flex-direction:column; gap:3px; }
  .doc-meta label{ font-size:11px; color:var(--ink-faint); }
  .doc-meta input, .doc-meta select{
    border:none; border-bottom:1px solid var(--line); background:none; padding:2px 0; color:var(--ink);
    min-width:120px;
  }
  .doc-meta input:focus, .doc-meta select:focus{ outline:none; border-color:var(--brand); }

  hr.rule{ border:none; border-top:1px solid var(--line); margin:22px 0; }

  h2.section-title{
    font-family:var(--font-serif); font-weight:600; font-size:22px; margin:0 0 6px;
    color:var(--ink);
  }
  p.section-help{ color:var(--ink-soft); font-size:13.3px; margin:0 0 20px; max-width:640px; }

  /* banners */
  .banner{
    border:1px solid var(--line); border-left:3px solid var(--brand);
    background:var(--paper-raised); padding:12px 15px; font-size:12.8px; color:var(--ink-soft);
    border-radius:2px; margin-bottom:20px; max-width:680px;
  }
  .banner b{ color:var(--ink); }
  .banner.warn{ border-left-color:var(--status-warn); }
  .banner a{ color:var(--brand-ink); }

  /* ingredients table */
  table.ingredients{ width:100%; border-collapse:collapse; margin-bottom:16px; }
  table.ingredients th{
    text-align:left; font-size:11.5px; color:var(--ink-faint); font-weight:500;
    padding:0 8px 6px 0; border-bottom:1px solid var(--line-strong);
  }
  table.ingredients td{ padding:6px 8px 6px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  table.ingredients input, table.ingredients select{
    width:100%; border:1px solid transparent; background:none; padding:5px 6px; border-radius:3px;
  }
  table.ingredients input:focus, table.ingredients select:focus{ outline:none; border-color:var(--brand); background:var(--paper-raised); }
  table.ingredients .col-nome{ width:44%; }
  table.ingredients .col-qtd{ width:14%; }
  table.ingredients .col-un{ width:14%; }
  table.ingredients .col-alerg{ width:22%; }
  table.ingredients .col-rm{ width:40px; text-align:center; }
  .row-remove{ background:none; border:none; color:var(--ink-faint); font-size:15px; }
  .row-remove:hover{ color:var(--status-bad); }

  .chips{ display:flex; flex-wrap:wrap; gap:4px; }
  .chip{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.2px;
    padding:2px 6px; border-radius:3px; background:var(--paper-2); color:var(--ink-soft);
    border:1px solid var(--line);
  }
  .chip.on{ background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent); font-weight:500; }
  .chip.trace{ background:var(--brand-soft); color:var(--brand-ink); border-color:var(--brand); }

  .allergen-panel{ margin-top:8px; }
  .allergen-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; margin:12px 0 20px; }
  .allergen-card{
    display:flex; align-items:center; gap:9px; padding:9px 11px;
    border:1px solid var(--line); border-radius:4px; background:var(--paper-raised); color:var(--ink-faint);
    font-size:13px;
  }
  .allergen-card.active{ border-color:var(--brand); background:var(--brand-soft); color:var(--brand-ink); }
  .allergen-card .code{ font-family:var(--font-mono); font-size:10.5px; border:1px solid currentColor; border-radius:3px; padding:1px 5px; }

  .trace-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .trace-item{ display:flex; align-items:center; gap:6px; font-size:12.8px; color:var(--ink-soft); }
  .trace-item input{ accent-color:var(--accent); }

  /* microbiology */
  .insa-select{ max-width:520px; padding:8px 10px; border:1px solid var(--line-strong); border-radius:4px; margin-bottom:14px; width:100%; }
  .group-desc{ background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; padding:14px 16px; margin-bottom:18px; max-width:680px; }
  .group-desc .code-badge{ font-family:var(--font-mono); background:var(--brand-soft); color:var(--brand-ink); padding:2px 7px; border-radius:3px; font-size:12px; margin-right:8px; }
  .group-desc h4{ margin:0 0 6px; font-size:15px; font-family:var(--font-serif); font-weight:600; display:inline; }
  .group-desc p{ margin:8px 0 0; color:var(--ink-soft); font-size:13px; }

  table.micro{ width:100%; border-collapse:collapse; margin:10px 0 18px; font-size:12.8px; }
  table.micro th{ text-align:left; font-weight:500; color:var(--ink-faint); font-size:11px; padding:6px 10px; border-bottom:1px solid var(--line-strong); }
  table.micro td{ padding:7px 10px; border-bottom:1px solid var(--line); font-family:var(--font-mono); font-size:12px; }
  table.micro td.name{ font-family:var(--font-sans); font-size:12.8px; }
  table.micro tr.flagged td.name{ font-weight:600; color:var(--accent-ink); }
  table.micro tr.flagged td.name::before{ content:"⚑ "; color:var(--accent); }
  .tier{ display:inline-block; padding:2px 7px; border-radius:3px; }
  .tier.ok{ background:var(--status-ok-bg); color:var(--status-ok); }
  .tier.warn{ background:var(--status-warn-bg); color:var(--status-warn); }
  .tier.bad{ background:var(--status-bad-bg); color:var(--status-bad); }
  .tier.danger{ background:var(--status-danger-bg); color:var(--status-danger); }
  .tier.na{ color:var(--ink-faint); }

  .indicator-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .indicator{ border-left:2px solid var(--line-strong); padding:2px 0 2px 12px; }
  .indicator b{ font-size:13.3px; }
  .indicator p{ margin:2px 0 0; font-size:12.6px; color:var(--ink-soft); }

  /* checklist */
  .checklist{ display:flex; flex-direction:column; gap:9px; margin-bottom:20px; max-width:640px; }
  .checklist label{ display:flex; align-items:flex-start; gap:9px; font-size:13.3px; color:var(--ink); }
  .checklist input{ margin-top:3px; accent-color:var(--brand); }

  textarea{
    width:100%; max-width:680px; border:1px solid var(--line-strong); border-radius:4px;
    padding:10px 12px; min-height:110px; resize:vertical; color:var(--ink);
  }
  textarea:focus{ outline:none; border-color:var(--brand); }

  .rte-toolbar{
    display:flex; gap:4px; max-width:680px; margin-bottom:-1px;
    border:1px solid var(--line-strong); border-bottom:none; border-radius:4px 4px 0 0;
    background:var(--paper-2); padding:5px 6px;
  }
  .rte-toolbar button{
    width:26px; height:24px; border:1px solid transparent; border-radius:3px; background:none;
    cursor:pointer; font-size:13px; color:var(--ink); line-height:1;
  }
  .rte-toolbar button:hover{ background:#DEE2D8; }
  .rte-toolbar button.active{ background:var(--brand-soft); border-color:var(--brand); }
  .rte-editor{
    width:100%; max-width:680px; box-sizing:border-box; border:1px solid var(--line-strong); border-radius:0 0 4px 4px;
    padding:10px 12px; min-height:110px; color:var(--ink); font-family:var(--font-sans); font-size:14.5px;
    overflow-y:auto;
  }
  .rte-editor:focus{ outline:none; border-color:var(--brand); }
  .rte-editor:empty::before{ content:attr(data-placeholder); color:var(--ink-faint); }

  .conf-grid{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:18px; }
  .conf-field{ display:flex; flex-direction:column; gap:5px; }
  .conf-field label{ font-size:11.5px; color:var(--ink-faint); }
  .conf-field input, .conf-field select{ padding:7px 9px; border:1px solid var(--line-strong); border-radius:4px; min-width:180px; }

  .add-row-btn{ margin-bottom:18px; }

  /* print sheet */
  .print-sheet{ background:var(--paper-raised); border:1px solid var(--line); padding:28px 32px; max-width:720px; color:#000; }
  .print-sheet h1{ font-family:var(--font-serif); font-size:26px; font-weight:700; color:var(--brand); margin:0 0 10px; border-bottom:3px solid var(--accent); padding-bottom:10px; display:inline-block; }
  .print-sheet .meta-row{ color:#000; font-size:12.8px; margin-bottom:18px; }
  .print-sheet h3{ font-family:var(--font-serif); font-size:16px; font-weight:700; color:var(--brand); border-bottom:1px solid var(--brand); padding-bottom:4px; margin:22px 0 8px; }
  .print-sheet ul{ margin:4px 0; padding-left:20px; }
  .print-sheet .allergen-line{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .print-sheet pre{ white-space:pre-wrap; font-family:var(--font-sans); font-size:13px; margin:0; }
  .print-footer{ display:none; }
  .print-header{ margin-bottom:18px; max-width:720px; padding-bottom:14px; border-bottom:2px solid #008DD2; }

  @media print{
    #app{ display:block; }
    #sidebar, .no-print{ display:none !important; }
    #main{ max-width:100%; padding:0; }
    body{ background:#fff; }
    .print-sheet{ border:none; padding:0; padding-top:150px; padding-bottom:50px; }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
    .print-footer{
      display:block; position:fixed; left:0; right:0; bottom:0;
      padding:8px 32px 12px; border-top:2px solid #008DD2;
      font-size:9px; color:#222; text-align:center; background:#fff;
    }
    .print-footer b{ color:#222; }
    .print-footer a{ color:#222; text-decoration:none; }
    .print-header{
      position:fixed; left:0; right:0; top:0; max-width:none;
      padding:18px 32px 16px; background:#fff;
      border-bottom:2px solid #008DD2;
    }
  }

  @media (max-width:760px){
    #app{ flex-direction:column; }
    #sidebar{ width:auto; border-right:none; border-bottom:1px solid var(--line); }
    #main{ padding:24px 18px 60px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>
<datalist id="ingredient-datalist"></datalist>

   DADOS DE REFERÊNCIA

// -- Os 14 alergénios de declaração obrigatória (Reg. (UE) n.º 1169/2011, Anexo II) --
function wordMatch(text, phrase){
  var esc = phrase.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  var re = new RegExp('(^|[^a-z0-9])' + esc + 's?([^a-z0-9]|$)', 'i');
  return re.test(text);
}
function anyMatch(text, list){ return list.some(function(k){ return wordMatch(text,k); }); }

function normalize(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function detectAllergens(text){
  var t = normalize(text);
  if(!t) return [];
  return ALLERGENS.filter(function(a){ return a.test(t); }).map(function(a){ return a.id; });
}

function computeFlaggedPathogens(ingredientNames){
  var joined = normalize(ingredientNames.join(' | '));
  var flagged = {};
  INGREDIENT_RISK_RULES.forEach(function(rule){
    if(rule.keys.some(function(k){ return joined.indexOf(normalize(k)) !== -1; })){
      rule.pathogens.forEach(function(p){ flagged[p] = true; });
    }
  });
  return flagged;
}

function libraryBaseName(nome){
  return normalize(nome).replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
}
function singularizeWord(w){
  return (w.length > 1 && w.slice(-1) === 's') ? w.slice(0, -1) : w;
}
function singularizePhrase(s){
  return s.split(' ').map(singularizeWord).join(' ');
}
function findLibraryMatch(name){
  var userBase = singularizePhrase(libraryBaseName(name));
  if(!userBase) return null;
  // 1) correspondência exata, após remover qualificadores entre parênteses e
  //    plurais simples (ex.: "Ovos" ≈ "Ovo (inteiro, cru)")
  var exact = INGREDIENT_LIBRARY.filter(function(i){
    return singularizePhrase(libraryBaseName(i.nome)) === userBase;
  })[0];
  if(exact) return exact;
  // 2) correspondência pela primeira palavra, só quando a entrada da biblioteca
  //    é uma única palavra — evita confundir variantes com identidade nutricional
  //    diferente (ex.: "leite de coco" nunca cai aqui, porque "Leite meio-gordo"
  //    tem mais do que uma palavra). Cobre casos como "Chouriço Corrente" ≈ "Chouriço".
  var userFirst = singularizeWord(userBase.split(' ')[0]);
  var byFirst = INGREDIENT_LIBRARY.filter(function(i){
    var libWords = libraryBaseName(i.nome).split(' ');
    return libWords.length === 1 && singularizeWord(libWords[0]) === userFirst;
  })[0];
  return byFirst || null;
}
function emptyNutri(){ return {kcal:'',proteina:'',hidratos:'',acucares:'',gordura:'',gordSat:'',fibra:'',sal:''}; }
// fator de conversão aproximado da unidade indicada para gramas/mililitros
function unitFactor(un){
  var u = normalize(un);
  if(['g','gr','grama','gramas'].indexOf(u)!==-1) return 1;
  if(['kg','quilo','quilograma','quilogramas'].indexOf(u)!==-1) return 1000;
  if(['ml','mililitro','mililitros'].indexOf(u)!==-1) return 1; // aproximação: densidade ~1
  if(['l','litro','litros'].indexOf(u)!==-1) return 1000;
  if(['dl'].indexOf(u)!==-1) return 100;
  if(['cl'].indexOf(u)!==-1) return 10;
  if(['colher de sopa','colher sopa','colheres de sopa','c sopa','c de sopa'].indexOf(u)!==-1) return 15;
  if(['colher de cha','colher cha','colheres de cha','c cha','c de cha'].indexOf(u)!==-1) return 5;
  if(['chavena','chavenas','xicara','xicaras','copo','copos'].indexOf(u)!==-1) return 240;
  return null;
}
// Devolve os gramas equivalentes a uma linha de ingrediente, incluindo a
// conversão aproximada de unidades contáveis ("un") a partir do peso médio
// por unidade guardado na biblioteca (ex.: 1 batata ≈ 170 g). Devolve null
// quando não há forma fiável de calcular o peso.
function gramsForIngredient(ing){
  var qty = parseFloat(String(ing.qtd).replace(',','.'));
  if(isNaN(qty)) return null;
  var factor = unitFactor(ing.un);
  if(factor != null) return { grams: qty * factor, estimated:false };
  var u = normalize(ing.un);
  if(['un','unidade','unidades'].indexOf(u) !== -1){
    var match = findLibraryMatch(ing.nome);
    if(match && match.unitG) return { grams: qty * match.unitG, estimated:true };
  }
  return null;
}

async function supabaseListRecipes(){

  }catch(networkErr){
    throw new Error('Falha de rede/CORS ao contactar ' + supabaseConfig.url + ' — verifique se o endereço está correto e se há ligação à internet.');
  }
  if(!res.ok){
    var detail = await supabaseErrorDetail(res);
    throw new Error('HTTP ' + res.status + (detail ? ' — ' + detail : '') + ' (pedido: ' + res.url + ')');
  }
  var rows = await res.json();
  return rows.map(function(r){ return { id:r.id, nome:r.nome || 'Sem nome', categoria:r.categoria || '', updatedAt:r.updated_at, idCliente:r.idcliente || '', empresaNome:r.empresanome || '', empresaContacto:r.empresacontacto || '', nif:r.nif || '' }; });

  }catch(err){ /* sem configuração guardada ainda */ }
}
async function saveSyncConfig(){
  var rawUrl = syncUrlDraft.trim();
  var key = syncKeyDraft.trim();
  if(!rawUrl || !key){ syncStatusMsg = 'Preencha o endereço e a chave.'; renderSidebar(); return; }

  var url;
  try{
    // usa apenas o protocolo+domínio, descartando qualquer caminho (ex.: /rest/v1)
    // que tenha sido colado por engano a seguir ao endereço do projeto
    url = new URL(rawUrl).origin;
  }catch(err){
    syncStatusMsg = 'Esse endereço não parece válido. Deve ser algo como https://abcxyz.supabase.co (sem mais nada a seguir).';
    renderSidebar();
    return;
  }

  syncStatusMsg = 'A testar ligação a ' + url + '…';
  renderSidebar();
  var testConfig = { url:url, anonKey:key };
  try{
    supabaseConfig = testConfig; // temporário, só para o teste
    await supabaseListRecipes();
    await appStorage.set('supabase-config', JSON.stringify(testConfig));
    syncStatusMsg = 'Ligado! Os dados já ficam disponíveis em qualquer navegador.';
    showSyncPanel = false;
    await refreshIndex();
    renderAll();
  }catch(err){
    supabaseConfig = { url:'', anonKey:'' };
    syncStatusMsg = 'Não foi possível ligar — ' + (err && err.message ? err.message : 'erro desconhecido') + '.';
    renderSidebar();
  }
}
async function clearSyncConfig(){
  supabaseConfig = { url:'', anonKey:'' };
  syncUrlDraft = ''; syncKeyDraft = ''; syncStatusMsg = '';
  try{ await appStorage.delete('supabase-config'); }catch(err){}
  await refreshIndex();
  renderAll();
}

// gestão de clientes à parte — evita duplicar dados e desincronização). Para
// cada ID Cliente distinto, usa os dados da ficha mais recente.
function getKnownClients(){
  var porId = {};
  savedIndex.forEach(function(r){
    if(!r.idCliente) return;
    if(!porId[r.idCliente] || new Date(r.updatedAt||0) > new Date(porId[r.idCliente].updatedAt||0)){
      porId[r.idCliente] = r;
    }
  });
  return Object.keys(porId).map(function(id){ return porId[id]; })
    .sort(function(a,b){ return (a.empresaNome||a.idCliente).localeCompare(b.empresaNome||b.idCliente); });
}

/* =========================================================

   ========================================================= */
var BASE_UNIDADES = ['g','kg','ml','l','dl','cl','un','dose','fatia','posta','rodela','dente',
  'colher de sopa','colher de chá','chávena','copo','pitada','ramo','embalagem','lata','pacote','q.b.'];
var customUnidades = [];        // unidades acrescentadas pelo utilizador, persistentes entre fichas
var showNewUnidadeIdx = null;   // índice da linha de ingrediente com o formulário "nova unidade" aberto
var manualAllergenRowOpen = null; // índice da linha com o painel de alergénios manuais aberto
var newUnidadeDraft = '';
function unidadeOptions(current){
  var todas = BASE_UNIDADES.concat(customUnidades);
  // preserva um valor já existente (ex.: introduzido antes desta funcionalidade)
  // mesmo que não conste da lista predefinida, para não perder dados.
  if(current && todas.indexOf(current) === -1) todas = [current].concat(todas);
  var opts = '<option value="" ' + (!current?'selected':'') + '>—</option>';
  opts += todas.map(function(u){
    return '<option value="' + escapeAttr(u) + '" ' + (current===u?'selected':'') + '>' + escapeHtml(u) + '</option>';
  }).join('');
  opts += '<option value="__nova_unidade__">+ Nova unidade…</option>';
  return opts;
}
function findExistingUnidade(nome){
  var n = normalize(nome);
  return BASE_UNIDADES.concat(customUnidades).filter(function(u){ return normalize(u)===n; })[0] || null;
}
async function confirmNewUnidade(){
  var nome = newUnidadeDraft.trim();
  var idx = showNewUnidadeIdx;
  if(!nome || idx==null){ showNewUnidadeIdx=null; newUnidadeDraft=''; renderMain(); return; }
  var existente = findExistingUnidade(nome);
  if(existente){
    state.ingredientes[idx].un = existente;
  } else {
    customUnidades.push(nome);
    state.ingredientes[idx].un = nome;
    if(storageOk){
      try{ await appStorage.set('custom-unidades', JSON.stringify(customUnidades)); }catch(err){}
    }
  }
  showNewUnidadeIdx = null;
  newUnidadeDraft = '';
  renderMain();
}

function renderIngredientes(){
  var rows = state.ingredientes.map(function(ing, idx){
    var badges = allergensForIngredient(ing);
    var unidadeCell = showNewUnidadeIdx===idx ?
      '<div style="display:flex;gap:4px;">' +
        '<input type="text" data-action="new-unidade-input" placeholder="nova unidade" value="' + escapeAttr(newUnidadeDraft) + '" style="width:90px;border:1px solid var(--line-strong);border-radius:4px;padding:5px 6px;" autofocus>' +
        '<button class="btn small primary" data-action="new-unidade-confirm">✓</button>' +
        '<button class="btn small" data-action="new-unidade-cancel">✕</button>' +
      '</div>' :
      '<select data-ing-unit="true" data-idx="' + idx + '">' + unidadeOptions(ing.un) + '</select>';
    var manualOpen = manualAllergenRowOpen === idx;
    var manualRow = manualOpen ?
      '<tr><td colspan="5" style="background:var(--paper-2);padding:10px 12px;">' +
        '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;">Assinalar alergénios manualmente para "' + escapeHtml(ing.nome||'este ingrediente') + '" (além dos já detetados automaticamente):</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;">' +
          ALLERGENS.map(function(a){
            var checked = (ing.manual||[]).indexOf(a.id) !== -1;
            return '<label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);">' +
              '<input type="checkbox" data-action="manual-allergen" data-idx="' + idx + '" data-allergen="' + a.id + '" ' + (checked?'checked':'') + ' style="accent-color:var(--brand);">' +
              a.label +
            '</label>';
          }).join('') +
        '</div>' +
      '</td></tr>' : '';
    return '<tr>' +
      '<td class="col-nome"><input type="text" list="ingredient-datalist" placeholder="ex.: farinha de trigo" value="' + escapeAttr(ing.nome) + '" data-ing-field="nome" data-idx="' + idx + '"></td>' +
      '<td class="col-qtd"><input type="text" placeholder="qtd." value="' + escapeAttr(ing.qtd) + '" data-ing-field="qtd" data-idx="' + idx + '"></td>' +
      '<td class="col-un">' + unidadeCell + '</td>' +
      '<td class="col-alerg"><div class="chips" id="badges-' + idx + '">' + renderBadgeChips(badges, ing.manual) + '</div>' +
        '<button class="btn small" data-action="toggle-manual-allergen" data-idx="' + idx + '" style="margin-top:4px;font-size:10.5px;padding:2px 6px;">' + (manualOpen ? 'Fechar' : '+ manual') + '</button>' +
      '</td>' +
      '<td class="col-nova"><select data-ing-nova="true" data-idx="' + idx + '">' + novaGrupoOptions(ing.novaGrupo) + '</select></td>' +
      '<td class="col-rm"><button class="row-remove" data-action="remove-ing" data-idx="' + idx + '" title="Remover">✕</button></td>' +
    '</tr>' + manualRow;
  }).join('');

  var novaLegenda = '<div style="display:flex;flex-wrap:wrap;gap:10px 18px;margin:8px 0 16px;font-size:11.5px;color:var(--ink);">' +
    NOVA_GROUPS.map(function(g){
      return '<span style="display:flex;align-items:center;gap:5px;">' +
        '<span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:3px;background:' + g.color + ';color:#fff;font-size:10px;font-weight:700;">' + g.code + '</span>' +
        g.label +
      '</span>';
    }).join('') +
  '</div>';

  return renderHeader() +
  '<h2 class="section-title">Lista de ingredientes</h2>' +
  '<p class="section-help">Introduza os ingredientes da receita. Os alergénios de cada linha são identificados automaticamente à medida que escreve (ver coluna à direita e o separador «Alergénios» para o resumo completo). Para nomes genéricos que a deteção automática não reconheça (ex.: "mistura de marisco"), use "+ manual" para assinalar alergénios à mão — os automáticos continuam a funcionar em paralelo. Surgem sugestões de uma pequena biblioteca de ingredientes comuns; ao escolher uma sugestão, o valor nutricional de referência é pré-preenchido no separador «Valor nutricional» (editável). Na unidade, escolha entre as opções predefinidas (coerentes com o uso em restauração) ou crie uma nova. O "Grupo NOVA" (grau de processamento) é sempre de escolha manual — não é uma exigência legal, e não há forma fiável de o deduzir automaticamente a partir do nome.</p>' +
  novaLegenda +
  '<table class="ingredients"><thead><tr>' +
    '<th class="col-nome">Ingrediente</th><th class="col-qtd">Quantidade</th><th class="col-un">Unidade</th><th class="col-alerg">Alergénios detetados</th><th class="col-nova">Grupo NOVA</th><th class="col-rm"></th>' +
  '</tr></thead><tbody id="ing-rows">' + rows + '</tbody></table>' +
  '<button class="btn add-row-btn" data-action="add-ing">+ Adicionar ingrediente</button>';
}
function renderBadgeChips(ids, manualIds){
  if(!ids.length) return '<span style="color:var(--ink-faint);font-size:11.5px;">—</span>';
  return ids.map(function(id){
    var a = ALLERGENS.filter(function(x){return x.id===id;})[0];
    var isManual = manualIds && manualIds.indexOf(id) !== -1;
    return '<span class="chip on" ' + (isManual ? 'title="Assinalado manualmente" style="border-style:dashed;"' : '') + '>' + a.short + (isManual ? '*' : '') + '</span>';
  }).join('');
}
// Alergénios de um ingrediente = deteção automática (pelo nome) + os que o
// utilizador tenha assinalado manualmente (para nomes genéricos como "mistura
// de marisco", onde o texto não contém nenhuma palavra reconhecida).
function allergensForIngredient(ing){
  var auto = detectAllergens(ing.nome);
  var manual = ing.manual || [];
  var set = {};
  auto.forEach(function(id){ set[id] = true; });
  manual.forEach(function(id){ set[id] = true; });
  return Object.keys(set);
}

function computeAllergensForRecipeData(recipeObj){
  var found = {};
  (recipeObj.ingredientes || []).forEach(function(ing){
    allergensForIngredient(ing).forEach(function(id){ found[id] = true; });
  });
  return found;
}
function computeNovaComposicao(){
  var porGrupo = {'1':[], '2':[], '3':[], '4':[]};
  var semGrupo = [];
  state.ingredientes.forEach(function(ing){
    if(!ing.nome) return;
    if(ing.novaGrupo && porGrupo[ing.novaGrupo]) porGrupo[ing.novaGrupo].push(ing.nome);
    else semGrupo.push(ing.nome);
  });
  return { porGrupo: porGrupo, semGrupo: semGrupo };
}
function computeRecipeAllergens(){
  var found = {};
  state.ingredientes.forEach(function(ing){
    allergensForIngredient(ing).forEach(function(id){ found[id] = true; });
  });
  return found;
}
function renderAlergenios(){
  var found = computeRecipeAllergens();
  var cards = ALLERGENS.map(function(a){
    var active = !!found[a.id];
    return '<div class="allergen-card ' + (active?'active':'') + '">' +
      '<span class="code">' + a.short + '</span><span>' + a.label + '</span>' +
    '</div>';
  }).join('');

  var traceItems = ALLERGENS.map(function(a){
    var checked = state.tracos.indexOf(a.id) !== -1;
    return '<label class="trace-item"><input type="checkbox" data-action="trace" data-id="' + a.id + '" ' + (checked?'checked':'') + '> ' + a.label + '</label>';
  }).join('');

  return renderHeader() +
  '<h2 class="section-title">Controlo de alergénios</h2>' +
  '<p class="section-help">Alergénios detetados automaticamente com base nos nomes dos ingredientes inseridos (Regulamento (UE) n.º 1169/2011, Anexo II — lista dos 14 alergénios de declaração obrigatória).</p>' +
  '<div class="banner warn"><b>Aviso importante:</b> a deteção é feita por correspondência de palavras-chave nos nomes dos ingredientes e serve apenas como apoio. Não substitui a verificação das fichas técnicas/rótulos dos fornecedores, nem deteta contaminação cruzada. É especialmente limitada em produtos processados ou compostos (ex.: enchidos, fiambre, salsichas, produtos pré-confecionados), que podem conter glúten, leite ou soja como espessantes/ligantes não evidentes pelo nome — confirme sempre o rótulo do fornecedor nestes casos. Confirme sempre com um responsável de segurança alimentar antes de declarar alergénios a um cliente.</div>' +
  '<div id="global-allergens" class="allergen-grid">' + cards + '</div>' +
  '<h2 class="section-title" style="font-size:17px;margin-top:26px;">Pode conter vestígios de</h2>' +
  '<p class="section-help">Assinale manualmente alergénios resultantes de contaminação cruzada possível na cozinha (equipamento partilhado, ambiente, etc.) — esta informação não é detetada automaticamente.</p>' +
  '<div class="trace-list">' + traceItems + '</div>';
}

var NUTRI_FIELDS = [
  {key:'kcal', label:'Energia (kcal)'},
  {key:'proteina', label:'Proteína (g)'},
  {key:'hidratos', label:'Hidratos de carbono (g)'},
  {key:'acucares', label:'dos quais açúcares (g)'},
  {key:'gordura', label:'Gordura (g)'},
  {key:'gordSat', label:'das quais saturadas (g)'},
  {key:'fibra', label:'Fibra (g)'},
  {key:'sal', label:'Sal (g)'}
];
function computeNutritionTotals(){
  var totals = {}; NUTRI_FIELDS.forEach(function(f){ totals[f.key] = 0; });
  var anyCalculable = false;
  var excluidos = [];
  var totalGrams = 0;
  state.ingredientes.forEach(function(ing){
    if(!ing.nome || !ing.qtd) return;
    var g = gramsForIngredient(ing);
    if(!g || !ing.nutri){ excluidos.push(ing.nome); return; }
    var hasAnyValue = NUTRI_FIELDS.some(function(f){ return ing.nutri[f.key] !== '' && ing.nutri[f.key] != null; });
    if(!hasAnyValue){ excluidos.push(ing.nome); return; }
    anyCalculable = true;
    totalGrams += g.grams;
    NUTRI_FIELDS.forEach(function(f){
      var v = parseFloat(String(ing.nutri[f.key]).replace(',','.'));
      if(!isNaN(v)) totals[f.key] += (v/100) * g.grams;
    });
  });
  return { totals:totals, anyCalculable:anyCalculable, excluidos:excluidos, totalGrams:totalGrams };
}
function renderNutricao(){
  var semQtd = state.ingredientes.filter(function(ing){ return ing.nome && !ing.qtd; }).length;
  var rows = state.ingredientes.map(function(ing, idx){
    if(!ing.nome || !ing.qtd) return '';
    var nutri = ing.nutri || emptyNutri();
    var g = gramsForIngredient(ing);
    var cells = NUTRI_FIELDS.map(function(f){
      return '<td><input type="text" style="width:64px;" value="' + escapeAttr(nutri[f.key]) + '" data-nutri-field="' + f.key + '" data-idx="' + idx + '" placeholder="—"></td>';
    }).join('');
    var nota = '';
    if(!g) nota = '<div style="font-size:10.5px;color:var(--status-warn);">unidade não convertível — não entra nos totais (use g, kg, ml, l, dl, cl, colher de sopa/chá, chávena/copo, ou "un" para ingredientes com peso médio conhecido)</div>';
    else if(g.estimated) nota = '<div style="font-size:10.5px;color:var(--accent-ink);">estimativa a partir do peso médio por unidade — confirme se necessário</div>';
    return '<tr>' +
      '<td class="name" style="padding:7px 10px;">' + escapeHtml(ing.nome) + (ing.nutriAuto ? ' <span title="valores pré-preenchidos a partir da biblioteca de ingredientes — editável" style="color:var(--accent-ink);font-size:11px;">●</span>' : '') +
      nota + '</td>' +
      cells +
    '</tr>';
  }).join('');

  var head = '<th style="padding:6px 10px;">Ingrediente</th>' + NUTRI_FIELDS.map(function(f){ return '<th style="padding:6px 8px;font-size:10.5px;">' + f.label + '<br><span style="color:var(--ink-faint);">/100g</span></th>'; }).join('');

  return renderHeader() +
  '<h2 class="section-title">Valor nutricional</h2>' +
  '<p class="section-help">Valores por 100 g/ml de cada ingrediente — preenchidos automaticamente quando reconhecidos a partir da biblioteca (assinalados com ●) e sempre editáveis. Um ingrediente só aparece aqui depois de ter uma quantidade preenchida no separador «Ingredientes». Os totais são calculados a partir da quantidade e unidade indicadas nesse separador — reconhece g, kg, ml, l, dl, cl, colher de sopa/chá, chávena/copo, e "un"/"unidade" para os ingredientes com peso médio já conhecido na biblioteca (ex.: batata, ovo, cebola).</p>' +
  (semQtd ? '<div class="banner warn">' + semQtd + (semQtd===1 ? ' ingrediente ainda não tem quantidade preenchida' : ' ingredientes ainda não têm quantidade preenchida') + ' no separador «Ingredientes» — por isso ainda não aparece' + (semQtd===1?'':'m') + ' aqui.</div>' : '') +
  '<div class="banner">Os valores pré-preenchidos são <b>genéricos de referência</b>, não os valores oficiais da Tabela da Composição de Alimentos (TCA). Para dados oficiais portugueses, consulte o <a href="https://portfir.insa.min-saude.pt/" target="_blank" rel="noopener">PortFIR / TCA do INSA</a> (citando a fonte: "Tabela da Composição de Alimentos. Instituto Nacional de Saúde Doutor Ricardo Jorge, I.P. – INSA").</div>' +
  '<div style="overflow-x:auto;"><table class="micro" style="min-width:760px;"><thead><tr>' + head + '</tr></thead>' +
  '<tbody id="nutri-rows">' + rows + '</tbody>' +
  '<tbody id="nutri-totals">' + renderNutriTotalsRows() + '</tbody>' +
  '</table></div>';
}
function renderNutriTotalsRows(){
  var totalsRes = computeNutritionTotals();
  var porcoesNum = parseFloat(String(state.porcoes).replace(',','.'));
  var totalsRow = '<tr style="font-weight:600;border-top:2px solid var(--line-strong);">' +
    '<td style="padding:8px 10px;">Total da receita</td>' +
    NUTRI_FIELDS.map(function(f){ return '<td style="padding:8px;">' + (totalsRes.anyCalculable ? totalsRes.totals[f.key].toFixed(1) : '—') + '</td>'; }).join('') +
  '</tr>';
  var perDoseRow = (totalsRes.anyCalculable && porcoesNum > 0) ?
    '<tr style="color:var(--brand-ink);">' +
      '<td style="padding:8px 10px;">Por dose (÷' + porcoesNum + ')</td>' +
      NUTRI_FIELDS.map(function(f){ return '<td style="padding:8px;">' + (totalsRes.totals[f.key]/porcoesNum).toFixed(1) + '</td>'; }).join('') +
    '</tr>' : '';
  return totalsRow + perDoseRow;
}

function tierClass(v){
  if(!v || v==='—') return 'na';
  var t = v.toLowerCase();
  if(t.indexOf('não detetado') !== -1) return 'ok';
  if(t.indexOf('detetado') !== -1) return 'danger';
  return null;
}
function renderMicrobioDetail(){
  var group = INSA_GROUPS.filter(function(x){return x.code===state.insaGroup;})[0];
  var groupHtml = group ?
    '<div class="group-desc"><span class="code-badge">' + group.code + '</span><h4>' + group.titulo + '</h4><p>' + group.exemplos + '</p></div>'
    : '<div class="banner">Selecione um Grupo/Subgrupo acima para ver a descrição e os exemplos de pratos correspondentes.</div>';

  var ingNames = state.ingredientes.map(function(i){return i.nome;});
  var flagged = computeFlaggedPathogens(ingNames);

  var rows = PATHOGENS.map(function(p){
    var isFlag = !!flagged[p.id];
    return '<tr class="' + (isFlag?'flagged':'') + '">' +
      '<td class="name">' + p.name + (p.nota ? ' <span title="' + escapeAttr(p.nota) + '" style="color:var(--ink-faint);cursor:help;">ⓘ</span>' : '') + '</td>' +
      '<td><span class="tier ok">' + p.sat + '</span></td>' +
      '<td>' + (p.naosat==='—' ? '<span class="tier na">—</span>' : '<span class="tier warn">' + p.naosat + '</span>') + '</td>' +
      '<td><span class="tier ' + (tierClass(p.perigoso)==='danger'?'danger':'bad') + '">' + p.perigoso + '</span></td>' +
    '</tr>';
  }).join('');

  var flaggedNote = Object.keys(flagged).length
    ? '<p class="section-help" style="margin-top:-6px;"><span style="color:var(--accent-ink);">⚑</span> Marcados os microrganismos com relevância acrescida para os ingredientes inseridos nesta receita (análise de perigos indicativa — não substitui um estudo HACCP).</p>'
    : '';

  var indicatorsHtml = HYGIENE_INDICATORS.map(function(h){
    return '<div class="indicator"><b>' + h.name + '</b><p>' + h.desc + '</p></div>';
  }).join('');

  return groupHtml +
  '<h3 style="font-family:var(--font-serif);font-size:16px;margin:22px 0 4px;">Microrganismos patogénicos e toxinas — valores-guia (aplicável a alimentos prontos para consumo, em geral)</h3>' +

  '<table class="micro"><thead><tr><th>Microrganismo/toxina</th><th>Satisfatório</th><th>Não satisfatório</th><th>Potencialmente perigoso</th></tr></thead><tbody>' + rows + '</tbody></table>' +
  '<h3 style="font-family:var(--font-serif);font-size:16px;margin:22px 0 4px;">Indicadores de higiene e de alteração</h3>' +
  '<p class="section-help">Os limites numéricos (ufc/g) destes indicadores variam consoante o Grupo/Subgrupo selecionado acima (Tabela 6 do documento original). Este protótipo apresenta o significado de cada indicador; confirme os valores numéricos exatos por subgrupo na fonte oficial.</p>' +
  '<div class="indicator-list">' + indicatorsHtml + '</div>' +
  '<textarea placeholder="Notas adicionais sobre parâmetros microbiológicos (ex.: critérios específicos de fornecedores, plano de amostragem interno)…" data-field="notasMicrobio">' + escapeHtml(state.notasMicrobio) + '</textarea>' +
  '<div class="banner" style="margin-top:16px;">Fonte: Instituto Nacional de Saúde Doutor Ricardo Jorge (INSA). <i>Interpretação de resultados de ensaios microbiológicos em alimentos prontos para consumo… : valores-guia</i>. Lisboa: INSA, 2019. ' +

  'Os "Valores-guia INSA" são recomendações indicativas, sem estatuto legal nem vínculo contratual, e não substituem o Regulamento (CE) n.º 2073/2005. Reprodução autorizada citando a fonte, <b>exceto para fins comerciais</b> — confirme condições junto do INSA caso pretenda utilização comercial desta app.</div>';
}

// state.confMetodo como texto simples).
function getConfMetodosArray(){
  if(Array.isArray(state.confMetodos)) return state.confMetodos;
  if(state.confMetodo) return [state.confMetodo];
  return [];
}
function findExistingMetodo(nome){
  var n = normalize(nome);
  return BASE_METODOS.concat(customMetodos).filter(function(m){ return normalize(m)===n; })[0] || null;
}
async function confirmNewMetodo(){
  var nome = newMetodoDraft.trim();
  if(!nome){ showNewMetodoInput=false; newMetodoDraft=''; renderMain(); return; }
  var existente = findExistingMetodo(nome);
  var atuais = getConfMetodosArray().slice();
  if(existente){
    if(atuais.indexOf(existente)===-1) atuais.push(existente);
  } else {
    customMetodos.push(nome);
    atuais.push(nome);
    if(storageOk){
      try{ await appStorage.set('custom-metodos', JSON.stringify(customMetodos)); }catch(err){}
    }
  }
  state.confMetodos = atuais;
  showNewMetodoInput = false;
  newMetodoDraft = '';
  renderMain();
}

  var texto = newConfNotaDraft.trim();

  if(!existente){

function renderFichaAllergenLegend(){
  var cols = 3;
  var cells = ALLERGENS.map(function(a){
    return '<td style="padding:4px 7px;border:1px solid var(--line);">' +
      '<span style="font-family:var(--font-mono);font-size:9px;border:1px solid #999;border-radius:3px;padding:1px 4px;margin-right:5px;color:#666;">' + a.short + '</span>' +
      '<span style="font-size:9px;color:#000;">' + escapeHtml(a.label) + '</span>' +
    '</td>';
  });
  while(cells.length % cols !== 0) cells.push('<td style="border:none;"></td>');
  var rows = [];
  for(var i=0;i<cells.length;i+=cols){
    rows.push('<tr>' + cells.slice(i, i+cols).join('') + '</tr>');
  }
  return '<table style="width:100%;border-collapse:collapse;margin-top:6px;">' + rows.join('') + '</table>';
}

// Lista de ingredientes em 1 coluna (poucos itens) ou 2 colunas lado a lado
// (mais de 6 itens), para reduzir o número de páginas em receitas longas.
// Usa uma tabela em vez de CSS de colunas para garantir que fica igual no
// ecrã, na impressão, no PDF e no Word.
function renderIngredientsBlock(items){
  function mkUl(list){
    return '<ul style="margin:4px 0;padding-left:20px;color:#000;">' + list.map(function(i){return '<li>'+i+'</li>';}).join('') + '</ul>';
  }
  if(!items.length) return mkUl(['<span style="color:#000;">Sem ingredientes registados.</span>']);
  if(items.length <= 6) return mkUl(items);
  var half = Math.ceil(items.length / 2);
  var col1 = items.slice(0, half), col2 = items.slice(half);
  return '<table style="width:100%;border-collapse:collapse;"><tr>' +
    '<td style="vertical-align:top;width:50%;padding:0 16px 0 0;">' + mkUl(col1) + '</td>' +
    '<td style="vertical-align:top;width:50%;padding:0 0 0 16px;">' + mkUl(col2) + '</td>' +
  '</tr></table>';
}
function buildKVTable(rows){
  return '<table style="width:100%;border-collapse:collapse;font-size:11px;color:#000;margin-bottom:10px;">' +

    }).join('') +
  '</table>';
}

    '<img src="' + ALIMENTARIUS_LOGO + '" style="height:64px;flex-shrink:0;">' +
    headerTextHtml +

  var colHeaders = ALLERGENS.map(function(a){
    return '<th style="padding:3px 2px;font-size:7px;color:#000;border:1px solid var(--line);">' + a.short + '</th>';
  }).join('');

  // Largura fixa (table-layout:fixed) — garante que a tabela nunca ultrapassa a
  // largura da página, mesmo com 15 colunas; sem isto, o excesso ficava cortado
  // ao imprimir/gerar PDF (um scroll horizontal não existe em papel).
  var colgroup = '<colgroup><col style="width:24%;">' + ALLERGENS.map(function(){ return '<col style="width:' + (76/ALLERGENS.length).toFixed(2) + '%;">'; }).join('') + '</colgroup>';

  // seu próprio cabeçalho de colunas repetido.
  var tableHtml = reportData.groups.map(function(g, gIdx){
    var rows = g.recipes.map(function(r){
      var cells = ALLERGENS.map(function(a){
        var mark = '';

    // Cada categoria começa numa página nova (exceto a primeira, para não deixar

    // envolver a tabela (não à própria tabela) — page-break-before diretamente
    // numa <table> é conhecido por ser pouco fiável em vários navegadores e no
    // Word, por causa do modo como as tabelas fragmentam entre páginas.
    var quebraPagina = gIdx > 0;
    var tabelaHtml = '<table data-repeat-header-rows="2" style="border-collapse:collapse;width:100%;table-layout:fixed;margin-bottom:16px;">' +
      colgroup +
      '<thead>' +
        '<tr data-keep-with-next="true"><td colspan="' + (ALLERGENS.length + 1) + '" style="background:#008DD2;color:#fff;font-weight:600;padding:5px 6px;font-size:10px;">' + escapeHtml(g.categoria.toUpperCase()) + '</td></tr>' +
        '<tr><th style="padding:3px 5px;font-size:7px;color:#000;border:1px solid var(--line);text-align:left;">Prato / Receita</th>' + colHeaders + '</tr>' +
      '</thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
    return quebraPagina
      ? '<div data-force-page-break="true" style="page-break-before:always;break-before:page;">' + tabelaHtml + '</div>'
      : tabelaHtml;

  var legendHtml = '<p style="font-size:10px;color:#000;margin-top:10px;"><b style="color:#A13A2A;">+</b> Contém &nbsp;&nbsp; <b style="color:#B8792A;">△</b> Pode conter &nbsp;&nbsp; Em branco: Ausente</p>';

  var abbrevNoteHtml = '<h3>Nota: significado das abreviaturas</h3>' +
    '<p style="font-size:9.5px;color:#000;margin-top:0;margin-bottom:2px;">Os 14 alergénios de declaração obrigatória (Regulamento (UE) n.º 1169/2011, anexo II) representados pelas abreviaturas usadas nas colunas da tabela acima.</p>' +
    renderCompactAllergenLegend();

  return '' +
  '<div class="no-print" style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;">' +
    '<button class="btn" data-action="report-back">← Voltar à ficha</button>' +
    '<button class="btn primary" onclick="window.print()">Imprimir</button>' +
    '<button class="btn" data-action="export-pdf">Descarregar PDF</button>' +
    '<button class="btn" data-action="export-word">Descarregar Word (.doc)</button>' +
  '</div>' +
  '<div class="print-header" id="print-header">' + headerHtml + '</div>' +
  '<div class="print-sheet" id="print-sheet">' +
    tableHtml + legendHtml + disclaimerHtml + abbrevNoteHtml +
  '</div>' +
  '<div class="print-footer">' + footerInnerHtml() + '</div>';
}

function escapeHtml(s){
  return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }
// Sanitiza o HTML guardado pelo editor de texto (campos com negrito): mantém
// só formatação básica (negrito, itálico, sublinhado, quebras de linha) e
// remove tudo o resto (scripts, atributos, colar de HTML externo, etc.).
var RTE_ALLOWED_TAGS = {B:1, STRONG:1, I:1, EM:1, U:1, BR:1, DIV:1, SPAN:1, P:1};
function sanitizeRichText(html){
  var tmp = document.createElement('div');
  tmp.innerHTML = html || '';
  (function clean(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(child){
      if(child.nodeType === 1){
        clean(child);
        if(!RTE_ALLOWED_TAGS[child.tagName]){
          while(child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
        } else {
          Array.prototype.slice.call(child.attributes).forEach(function(a){ child.removeAttribute(a.name); });
        }
      }
    });
  })(tmp);
  return tmp.innerHTML;
}
function renderRichTextEditor(field, htmlValue, placeholder){
  return '' +
  '<div class="rte-toolbar no-print">' +
    '<button type="button" data-action="rte-bold" data-target="' + field + '" title="Negrito"><b>B</b></button>' +
  '</div>' +
  '<div class="rte-editor" contenteditable="true" data-rte-field="' + field + '" data-placeholder="' + escapeAttr(placeholder) + '">' + (htmlValue||'') + '</div>';
}

document.addEventListener('change', function(e){

    var id = el.getAttribute('data-id');
    var i = state.tracos.indexOf(id);
    if(el.checked && i===-1) state.tracos.push(id);

   EXPORTAÇÃO — PDF (html2canvas + jsPDF) e Word (.doc)

function fileSafeName(){
  var base = reportMode
    ? ('tabela-alergenios-' + (reportData ? reportData.clientLabel : 'cliente'))
    : (state.nome || 'ficha-tecnica') + (fichaViewMode==='profissional' ? '-profissional' : '');
  return base.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'ficha-tecnica';
}
async function buildPdfFooterCanvas(){
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:650px;padding:10px 0 4px;border-top:2px solid #008DD2;text-align:center;background:#ffffff;font-family:"IBM Plex Sans",Arial,sans-serif;';
  el.innerHTML =
    '<div style="font-weight:600;font-size:9px;color:#222;">Alimentarius | HACCP | Segurança Alimentar | Formação</div>' +
    '<div style="font-size:9px;color:#222;margin-top:3px;">🌐&nbsp;www.alimentarius.pt&nbsp;&nbsp;|&nbsp;&nbsp;✉&nbsp;alimentarius@alimentarius.pt' +
    ((state.responsavel || state.data) ? '&nbsp;&nbsp;|&nbsp;&nbsp;' +
      (state.responsavel ? 'Técnico Responsável: ' + escapeHtml(state.responsavel) : '') +
      (state.responsavel && state.data ? ' · ' : '') +
      (state.data || '') : '') +
    '</div>' +
    '<div style="font-size:9px;color:#444;margin-top:3px;">Documento não controlado após impressão — a versão válida é sempre a mais recente no sistema. A Alimentarius não se responsabiliza por alterações manuais ou desatualizações após impressão.</div>';
  document.body.appendChild(el);
  var canvas;
  try{
    canvas = await window.html2canvas(el, { scale:2, backgroundColor:'#ffffff' });
  } finally {
    document.body.removeChild(el);
  }
  return canvas;
}
async function exportPdf(btn){
  var sheet = document.getElementById('print-sheet');
  if(!sheet || !window.html2canvas || !window.jspdf){
    alert('Não foi possível carregar as bibliotecas de exportação (é necessária ligação à internet). Pode usar "Imprimir" e guardar como PDF a partir do diálogo de impressão.');
    return;
  }
  var originalText = btn.textContent;
  btn.textContent = 'A gerar PDF…'; btn.disabled = true;
  try{
    var canvas = await window.html2canvas(sheet, {scale:2, backgroundColor:'#ffffff'});
    var imgData = canvas.toDataURL('image/png');
    var { jsPDF } = window.jspdf;
    var pdf = new jsPDF('p','pt','a4');
    var pageWidth = pdf.internal.pageSize.getWidth();
    var pageHeight = pdf.internal.pageSize.getHeight();
    var margin = 24;
    var imgWidth = pageWidth - margin*2;
    var imgHeight = imgWidth * canvas.height / canvas.width;

    var footerCanvas = await buildPdfFooterCanvas();
    var footerImgData = footerCanvas.toDataURL('image/png');
    var footerHeightPt = imgWidth * footerCanvas.height / footerCanvas.width;
    function drawFooter(){
      pdf.addImage(footerImgData, 'PNG', margin, pageHeight - margin - footerHeightPt, imgWidth, footerHeightPt);
    }

    var headerEl = document.getElementById('print-header');
    var headerCanvas = await window.html2canvas(headerEl, {scale:2, backgroundColor:'#ffffff'});
    var headerImgData = headerCanvas.toDataURL('image/png');
    var headerHeightPt = imgWidth * headerCanvas.height / headerCanvas.width;
    function drawHeader(){
      pdf.addImage(headerImgData, 'PNG', margin, margin, imgWidth, headerHeightPt);
    }

    var topReserve = headerHeightPt + 16; // espaço reservado no topo de cada página para o cabeçalho
    var footerReserve = footerHeightPt + 14; // espaço reservado no fundo de cada página para o rodapé
    var contentTop = margin + topReserve;
    var contentHeightPt = pageHeight - margin*2 - footerReserve - topReserve;
    var pageCanvasHeightPx = contentHeightPt * (canvas.width / imgWidth);

    var temQuebraForcada = sheet.querySelectorAll('[data-force-page-break="true"]').length > 0;
    if(imgHeight <= contentHeightPt && !temQuebraForcada){
      pdf.addImage(imgData, 'PNG', margin, contentTop, imgWidth, imgHeight);
      drawFooter();
      drawHeader();
    } else {
      // Pontos de quebra seguros: o fim de cada elemento de primeiro nível dentro
      // da ficha (títulos, listas, tabelas, parágrafos...). Listas e tabelas que
      // cabem inteiras numa página são tratadas como um bloco indivisível (nunca
      // partidas a meio de um item/linha); só quando o bloco é maior do que uma
      // página inteira é que se permite quebrar dentro dele, por não haver
      // alternativa.
      var scale = canvas.width / sheet.offsetWidth;
      var sheetTop = sheet.getBoundingClientRect().top;
      function breakPointFor(el){
        return Math.round((el.getBoundingClientRect().bottom - sheetTop) * scale);
      }
      function topFor(el){
        return Math.round((el.getBoundingClientRect().top - sheetTop) * scale);
      }
      var breakPoints = [0, canvas.height];
      Array.prototype.forEach.call(sheet.children, function(child){
        breakPoints.push(breakPointFor(child));
      });
      // "Manter bloco inteiro" só se aplica a listas/tabelas PEQUENAS (até 35% da
      // altura útil de uma página, ex.: uma checklist de 4-5 itens). Para blocos
      // maiores (ex.: a tabela de 16 microrganismos), forçar tudo para a página
      // seguinte desperdiçaria demasiado espaço em branco — nesses casos continua
      // a permitir-se quebrar entre linhas/itens.
      var keepTogetherThreshold = pageCanvasHeightPx * 0.35;
      var keepTogetherBounds = Array.prototype.map.call(sheet.querySelectorAll('ul, table'), function(el){
        return { top: topFor(el), bottom: breakPointFor(el) };
      }).filter(function(b){ return (b.bottom - b.top) <= keepTogetherThreshold; });
      Array.prototype.forEach.call(sheet.querySelectorAll('tr, li'), function(el){
        var pt = breakPointFor(el);
        var insideSmallBlock = keepTogetherBounds.some(function(b){
          return pt > b.top && pt <= b.bottom;
        });
        if(!insideSmallBlock) breakPoints.push(pt);
      });
      breakPoints = breakPoints.filter(function(p){ return p>=0 && p<=canvas.height; });
      breakPoints = Array.from(new Set(breakPoints)).sort(function(a,b){ return a-b; });

      // Controlo de "órfãos": um título de secção (h3) — ou outro elemento marcado
      // com data-keep-with-next — nunca deve ficar sozinho no fim de uma página.
      // Isto cobre não só o título isolado, mas também o caso mais comum: título +
      // um pequeno parágrafo de introdução ficarem numa página, com a tabela/lista
      // principal a saltar para a seguinte. A "zona protegida" de cada título
      // estica-se por cima de parágrafos/divisões de introdução consecutivos, e
      // inclui a tabela/lista que se seguir só se essa tabela for pequena (já
      // tratada como bloco indivisível) — uma tabela grande mantém-se livre para
      // paginar internamente, para não desperdiçar página.
      var sheetChildrenArr = Array.prototype.slice.call(sheet.children);
      var headingZones = [];
      sheetChildrenArr.forEach(function(el, idx){
        var isHeading = el.tagName === 'H3' || el.hasAttribute('data-keep-with-next');
        if(!isHeading) return;
        var zoneTop = topFor(el);
        var zoneBottomEl = el;
        var j = idx + 1;
        while(j < sheetChildrenArr.length){
          var sib = sheetChildrenArr[j];
          var tag = sib.tagName;
          if(tag === 'H3') break;
          if(tag === 'TABLE' || tag === 'UL' || tag === 'OL'){
            var sibHeight = breakPointFor(sib) - topFor(sib);
            if(sibHeight <= keepTogetherThreshold){
              zoneBottomEl = sib; // bloco pequeno: a zona cobre-o por inteiro
            } else {
              // bloco grande: garante pelo menos a 1ª linha/item junto ao título,
              // para nunca ficar "título + introdução" sem nada de conteúdo real
              var firstRow = sib.querySelector('tr, li');
              zoneBottomEl = firstRow || sib;
            }
            break;
          }
          zoneBottomEl = sib;
          j++;
        }
        headingZones.push({ top: zoneTop, bottom: breakPointFor(zoneBottomEl) });
      });

      // Quebras de página forçadas (ex.: início de cada categoria na tabela de
      // alergénios do cliente) — têm sempre prioridade sobre o resto: nunca se
      // junta conteúdo de antes com o que vem a seguir a um destes pontos.
      var forcedBreakPoints = Array.prototype.map.call(sheet.querySelectorAll('[data-force-page-break="true"]'), function(el){
        return topFor(el);
      }).sort(function(a,b){ return a-b; });

      // Tabelas grandes de mais para caber numa página (ex.: uma categoria com
      // muitas receitas na tabela de alergénios do cliente): quando isso
      // acontece, repete a barra de categoria + cabeçalho de colunas no topo
      // de cada página em que essa tabela continua — sem isto, a continuação
      // aparecia sem se saber a que categoria/colunas pertencia.
      var repeatHeaderTables = Array.prototype.map.call(sheet.querySelectorAll('table[data-repeat-header-rows]'), function(tbl){
        var n = parseInt(tbl.getAttribute('data-repeat-header-rows'), 10) || 0;
        if(!n || !tbl.rows || tbl.rows.length <= n) return null;
        return {
          headerTop: topFor(tbl.rows[0]),
          headerBottom: breakPointFor(tbl.rows[n-1]),
          tableEnd: breakPointFor(tbl)
        };
      }).filter(Boolean);
      function miniHeaderFor(pos){
        for(var i=0;i<repeatHeaderTables.length;i++){
          var t = repeatHeaderTables[i];
          if(pos >= t.headerBottom && pos < t.tableEnd) return t;
        }
        return null;
      }

      var pageStart = 0;
      var pageIndex = 0;
      while(pageStart < canvas.height - 1){
        var mh = miniHeaderFor(pageStart);
        var mhHeightPx = mh ? (mh.headerBottom - mh.headerTop) : 0;
        var mhHeightPt = mhHeightPx * (imgWidth / canvas.width);
        var effectivePageCanvasHeightPx = (contentHeightPt - mhHeightPt) * (canvas.width / imgWidth);

        var limit = pageStart + effectivePageCanvasHeightPx;
        var chosen = pageStart;
        for(var i=0;i<breakPoints.length;i++){
          if(breakPoints[i] > pageStart && breakPoints[i] <= limit) chosen = breakPoints[i];
          if(breakPoints[i] > limit) break;
        }
        // se nenhum ponto de quebra couber (secção maior do que uma página inteira),
        // corta no limite mesmo assim — melhor do que ficar preso num ciclo infinito
        if(chosen <= pageStart) chosen = Math.min(limit, canvas.height);

        headingZones.forEach(function(z){
          if(chosen > z.top && chosen < z.bottom && z.top > pageStart) chosen = z.top;
        });
        forcedBreakPoints.forEach(function(fp){
          if(fp > pageStart && fp < chosen) chosen = fp;
        });

        var sliceHeightPx = Math.round(chosen - pageStart);
        var sliceCanvas = document.createElement('canvas');
        sliceCanvas.width = canvas.width;
        sliceCanvas.height = sliceHeightPx;
        var ctx = sliceCanvas.getContext('2d');
        ctx.drawImage(canvas, 0, pageStart, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
        var sliceImg = sliceCanvas.toDataURL('image/png');
        var sliceImgHeight = imgWidth * sliceHeightPx / canvas.width;
        if(pageIndex>0) pdf.addPage();

        var drawY = contentTop;
        if(mh){
          var mhCanvas = document.createElement('canvas');
          mhCanvas.width = canvas.width;
          mhCanvas.height = mhHeightPx;
          mhCanvas.getContext('2d').drawImage(canvas, 0, mh.headerTop, canvas.width, mhHeightPx, 0, 0, canvas.width, mhHeightPx);
          pdf.addImage(mhCanvas.toDataURL('image/png'), 'PNG', margin, drawY, imgWidth, mhHeightPt);
          drawY += mhHeightPt;
        }
        pdf.addImage(sliceImg, 'PNG', margin, drawY, imgWidth, sliceImgHeight);
        drawFooter();
        drawHeader();
        pageStart = chosen;
        pageIndex++;
      }
    }
    pdf.save(fileSafeName() + '.pdf');
  }catch(err){
    alert('Ocorreu um erro ao gerar o PDF. Pode usar "Imprimir" e guardar como PDF a partir do diálogo de impressão.');
  }
  btn.textContent = originalText; btn.disabled = false;
}
// Converte os estilos calculados (incluindo cores resolvidas a partir de
// variáveis CSS e de classes) em atributos "style" inline em cada elemento.
// Necessário para o Word, que ignora <style> com classes e não suporta
// variáveis CSS — só respeita estilo inline com valores concretos.
var STYLE_PROPS_TO_BAKE = [
  'color','background-color','font-weight','font-style','font-family','font-size','line-height',
  'border-top-color','border-right-color','border-bottom-color','border-left-color',
  'border-top-width','border-right-width','border-bottom-width','border-left-width',
  'border-top-style','border-right-style','border-bottom-style','border-left-style',
  'padding-top','padding-right','padding-bottom','padding-left',
  'margin-top','margin-right','margin-bottom','margin-left',
  'text-align','width','height','max-width','vertical-align','white-space',
  'letter-spacing','text-decoration','page-break-before'
];
function isFullyTransparent(v){
  var m = /rgba\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*,\s*0\s*\)/.exec(v);
  return !!m || v === 'transparent';
}
function bakeInlineStyles(sourceEl, cloneEl){
  var cs = window.getComputedStyle(sourceEl);
  var styleStr = '';
  STYLE_PROPS_TO_BAKE.forEach(function(p){
    var v = cs.getPropertyValue(p);
    if(!v) return;
    // o Word não interpreta bem rgba(...,0) — em vez de "transparente", costuma
    // desenhar um fundo preto sólido. Nestes casos, omitimos a propriedade.
    if((p === 'background-color' || p.indexOf('border') === 0) && isFullyTransparent(v)) return;
    styleStr += p + ':' + v + ';';
  });
  cloneEl.setAttribute('style', styleStr);
  var sourceChildren = sourceEl.children;
  var cloneChildren = cloneEl.children;
  for(var i=0;i<sourceChildren.length;i++){
    if(cloneChildren[i]) bakeInlineStyles(sourceChildren[i], cloneChildren[i]);
  }
}
// O Word não suporta "display:flex" — os elementos ficam simplesmente
// empilhados verticalmente. Para blocos onde o lado a lado é essencial
// (ex.: logótipo ao lado do nome da empresa), convertemos para uma tabela
// de uma linha, que o Word interpreta de forma fiável.
function convertFlexRowsToTables(root){
  var rows = root.querySelectorAll('[data-word-flex="row"]');
  rows.forEach(function(el){
    var children = Array.prototype.slice.call(el.children);
    if(!children.length) return;
    var table = document.createElement('table');
    table.setAttribute('style', 'border-collapse:collapse;');
    var tr = document.createElement('tr');
    children.forEach(function(child, i){
      var td = document.createElement('td');
      td.setAttribute('style', 'vertical-align:middle;border:none;padding:0 ' + (i < children.length - 1 ? '14px' : '0') + ' 0 0;');
      td.appendChild(child);
      tr.appendChild(td);
    });
    table.appendChild(tr);
    el.parentNode.replaceChild(table, el);
  });
}
function exportWord(){
  var sheet = document.getElementById('print-sheet');
  if(!sheet) return;
  var clone = sheet.cloneNode(true);
  bakeInlineStyles(sheet, clone);
  convertFlexRowsToTables(clone);
  // O Word nem sempre respeita de forma fiável page-break-before em CSS — a
  // forma mais garantida de forçar quebra de página neste formato é este
  // carácter especial reconhecido pelo próprio Word.
  Array.prototype.forEach.call(clone.querySelectorAll('[data-force-page-break="true"]'), function(el){
    var br = document.createElement('br');
    br.setAttribute('clear', 'all');
    br.setAttribute('style', 'mso-special-character:line-break;page-break-before:always');
    el.parentNode.insertBefore(br, el);
  });

  var headerEl = document.getElementById('print-header');
  var headerWordHtml = '<img src="' + ALIMENTARIUS_LOGO + '" style="height:50px;">';
  if(headerEl){
    var headerClone = headerEl.cloneNode(true);
    bakeInlineStyles(headerEl, headerClone);
    convertFlexRowsToTables(headerClone);
    headerWordHtml = headerClone.innerHTML;
  }

  var htmlContent = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="utf-8"><title>' + escapeHtml(reportMode ? 'Tabela de alergénios' : (state.nome||'Ficha técnica')) + '</title>' +
    '<style>' +
      'body{font-family:Calibri,Arial,sans-serif;color:#1E2A28;} table{border-collapse:collapse;}' +
      '@page Section1{ mso-header:h1; mso-footer:f1; }' +
      'div.Section1{ page:Section1; }' +
    '</style>' +
    '</head><body>' +

      '</p>' +

/* =========================================================
   PERSISTÊNCIA (appStorage — window.storage ou localStorage, consoante o ambiente)
   ========================================================= */
async function refreshIndex(){
  if(supabaseReady()){
    try{ savedIndex = await supabaseListRecipes(); }
    catch(err){ savedIndex = []; syncStatusMsg = 'Não foi possível ligar ao Supabase neste momento.'; }
    return;
  }
  if(!storageOk){ savedIndex = []; return; }
  try{
    var res = await appStorage.get('recipes-index');
    savedIndex = res ? JSON.parse(res.value) : [];
  }catch(err){ savedIndex = []; }
}
async function saveRecipe(){
  if(supabaseReady()){
    try{
      if(!state.id) state.id = 'r_' + Date.now();
      await supabaseSaveRecipe(state);
      statusMsg = 'Ficha guardada no Supabase.';
      await refreshIndex();
    }catch(err){ statusMsg = 'Erro ao guardar no Supabase — verifique a ligação.'; }
    renderSidebar();
    return;
  }
  if(!storageOk){ statusMsg = 'Guardar não disponível neste ambiente.'; renderSidebar(); return; }
  try{
    if(!state.id) state.id = 'r_' + Date.now();
    await appStorage.set('recipe:' + state.id, JSON.stringify(state));
    var idx = savedIndex.findIndex(function(r){return r.id===state.id;});
    var entry = { id:state.id, nome:state.nome || 'Sem nome', categoria:state.categoria, idCliente:state.idCliente || '', empresaNome:state.empresaNome || '', empresaContacto:state.empresaContacto || '', nif:state.nif || '', updatedAt:new Date().toISOString() };
    if(idx===-1) savedIndex.push(entry); else savedIndex[idx] = entry;
    await appStorage.set('recipes-index', JSON.stringify(savedIndex));
    statusMsg = 'Ficha guardada.';
  }catch(err){ statusMsg = 'Erro ao guardar.'; }
  renderSidebar();
}
// Garante que fichas guardadas antes de existirem certos campos (escolha
// múltipla de método, notas avulsas, alergénios manuais por ingrediente) não
// quebram a app ao serem carregadas — sem isto, um campo em falta (undefined)
// causa um erro a meio do desenho da página, que fica em branco.
function normalizeLoadedRecipe(data){
  if(!Array.isArray(data.confMetodos)) data.confMetodos = data.confMetodo ? [data.confMetodo] : [];
  if(!Array.isArray(data.confNotas)) data.confNotas = [];
  if(!Array.isArray(data.ingredientes)) data.ingredientes = [];
  data.ingredientes.forEach(function(ing){
    if(!Array.isArray(ing.manual)) ing.manual = [];
    if(typeof ing.novaGrupo !== 'string') ing.novaGrupo = '';
  });
  if(!Array.isArray(data.tracos)) data.tracos = [];
  if(!data.prepChecklist || typeof data.prepChecklist !== 'object') data.prepChecklist = {};
  if(!Array.isArray(data.prepChecklistCustom)) data.prepChecklistCustom = [];
  return data;
}
async function loadRecipe(id){
  if(supabaseReady()){
    try{
      var dados = await supabaseGetRecipe(id);
      if(dados){ state = normalizeLoadedRecipe(dados); activeTab='identificacao'; statusMsg=''; renderAll(); }
    }catch(err){ statusMsg = 'Não foi possível carregar a ficha do Supabase.'; renderSidebar(); }
    return;
  }
  if(!storageOk) return;
  try{
    var res = await appStorage.get('recipe:' + id);
    if(res){ state = normalizeLoadedRecipe(JSON.parse(res.value)); activeTab='identificacao'; statusMsg=''; renderAll(); }
  }catch(err){ statusMsg = 'Não foi possível carregar a ficha.'; renderSidebar(); }
}
async function duplicateRecipe(id){
  statusMsg = 'A duplicar…';
  renderSidebar();
  try{
    var original = null;
    if(supabaseReady()) original = await supabaseGetRecipe(id);
    else if(storageOk){ var res = await appStorage.get('recipe:' + id); original = res ? JSON.parse(res.value) : null; }
    if(!original){ statusMsg = 'Não foi possível duplicar esta ficha.'; renderSidebar(); return; }

    var copy = normalizeLoadedRecipe(JSON.parse(JSON.stringify(original))); // cópia independente, sem ligação à original
    copy.id = null; // fica sem id -> ao guardar, é criada uma ficha nova
    copy.nome = (copy.nome || 'Sem nome') + ' (cópia)';
    state = copy;
    await saveRecipe(); // atribui novo id e grava já, para aparecer logo na lista
    activeTab = 'identificacao';
    fichaViewMode = 'padrao';
    statusMsg = 'Ficha duplicada — pode editar à vontade.';
    renderAll();
  }catch(err){
    statusMsg = 'Não foi possível duplicar esta ficha.';
    renderSidebar();
  }
}
async function deleteRecipe(id){
  if(supabaseReady()){
    try{
      await supabaseDeleteRecipe(id);
      if(state.id===id){ state = blankRecipe(); activeTab='identificacao'; }
      await refreshIndex();
      renderAll();
    }catch(err){ statusMsg = 'Não foi possível eliminar a ficha no Supabase.'; renderSidebar(); }
    return;
  }
  if(!storageOk) return;
  try{
    await appStorage.delete('recipe:' + id);
    savedIndex = savedIndex.filter(function(r){return r.id!==id;});
    await appStorage.set('recipes-index', JSON.stringify(savedIndex));
    if(state.id===id){ state = blankRecipe(); activeTab='identificacao'; }
    renderAll();
  }catch(err){ statusMsg = 'Não foi possível eliminar a ficha.'; renderSidebar(); }
}

async function generateAllergenReport(){
  if(!clientFilter){ statusMsg = 'Selecione um cliente no filtro acima para gerar a tabela.'; renderSidebar(); return; }
  statusMsg = 'A gerar tabela…';
  renderSidebar();
  try{
    var matching = savedIndex.filter(function(r){ return r.idCliente === clientFilter; });
    var fullRecipes = [];
    for(var i=0;i<matching.length;i++){
      var full = null;
      try{
        if(supabaseReady()) full = await supabaseGetRecipe(matching[i].id);
        else if(storageOk){ var res = await appStorage.get('recipe:' + matching[i].id); full = res ? JSON.parse(res.value) : null; }
      }catch(err){ /* ignora fichas que não foi possível ler */ }
      if(full) fullRecipes.push(full);
    }
    if(!fullRecipes.length){
      statusMsg = 'Não foi possível carregar as fichas deste cliente.';
      renderSidebar();
      return;
    }
    var groupsMap = {};
    var groupOrder = [];
    var clientInfo = { empresaNome:'', empresaContacto:'', nif:'', idCliente:clientFilter };
    fullRecipes.forEach(function(r){
      var cat = r.categoria || 'Sem categoria';
      if(!groupsMap[cat]){ groupsMap[cat] = []; groupOrder.push(cat); }
      groupsMap[cat].push({
        nome: r.nome || 'Sem nome',
        detected: computeAllergensForRecipeData(r),
        trace: r.tracos || []
      });
      if(!clientInfo.empresaNome && r.empresaNome) clientInfo.empresaNome = r.empresaNome;
      if(!clientInfo.empresaContacto && r.empresaContacto) clientInfo.empresaContacto = r.empresaContacto;
      if(!clientInfo.nif && r.nif) clientInfo.nif = r.nif;
    });
    reportData = {
      clientLabel: clientFilter,
      clientInfo: clientInfo,
      groups: groupOrder.map(function(cat){ return { categoria:cat, recipes:groupsMap[cat] }; })
    };
    reportMode = true;
    statusMsg = '';
    renderAll();
  }catch(err){
    statusMsg = 'Não foi possível gerar a tabela.';
    renderSidebar();
  }
}
async function exportAllData(btn){
  var originalText = btn ? btn.textContent : '';
  if(btn){ btn.textContent = 'A preparar exportação…'; btn.disabled = true; }
  var porId = {};
  try{
    if(supabaseReady()){
      for(var i=0;i<savedIndex.length;i++){
        try{
          var dados = await supabaseGetRecipe(savedIndex[i].id);
          if(dados) porId[savedIndex[i].id] = dados;
        }catch(err){ /* ignora fichas que não foi possível ler */ }
      }
    } else if(storageOk){
      for(var i=0;i<savedIndex.length;i++){
        try{
          var res = await appStorage.get('recipe:' + savedIndex[i].id);
          if(res) porId[savedIndex[i].id] = JSON.parse(res.value);
        }catch(err){ /* ignora fichas que não foi possível ler */ }
      }
    }
    // garante que a ficha atualmente aberta vai sempre incluída, mesmo que ainda
    // não tenha sido guardada ou tenha alterações por guardar
    if(state.id) porId[state.id] = state;
    else porId['ficha_nao_guardada_' + Date.now()] = state;

    var payload = {
      exportadoEm: new Date().toISOString(),
      origem: 'Fichas Técnicas — protótipo',
      totalFichas: Object.keys(porId).length,
      fichas: Object.values(porId)
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'fichas-tecnicas-export-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }catch(err){
    alert('Não foi possível exportar os dados.');
  }
  if(btn){ btn.textContent = originalText; btn.disabled = false; }
}

async function importData(file){
  statusMsg = 'A importar…';
  renderSidebar();
  try{
    var text = await file.text();
    var payload = JSON.parse(text);
    var fichas = Array.isArray(payload.fichas) ? payload.fichas : (Array.isArray(payload) ? payload : [payload]);
    if(!fichas.length){ statusMsg = 'O ficheiro não continha fichas reconhecíveis.'; renderSidebar(); return; }

    var importadas = 0;
    for(var i=0;i<fichas.length;i++){
      var ficha = fichas[i];
      if(!ficha || typeof ficha !== 'object') continue;
      var temIdReal = ficha.id && String(ficha.id).indexOf('ficha_nao_guardada_') !== 0;
      var id = temIdReal ? ficha.id : ('r_' + Date.now() + '_' + i);
      ficha.id = id;
      if(supabaseReady()){
        try{ await supabaseSaveRecipe(ficha); }catch(err){ continue; }
      } else if(storageOk){
        await appStorage.set('recipe:' + id, JSON.stringify(ficha));
      }
      var idx = savedIndex.findIndex(function(r){ return r.id===id; });
      var entry = { id:id, nome:ficha.nome || 'Sem nome', categoria:ficha.categoria || '', idCliente:ficha.idCliente || '', empresaNome:ficha.empresaNome || '', empresaContacto:ficha.empresaContacto || '', nif:ficha.nif || '', updatedAt:new Date().toISOString() };
      if(idx===-1) savedIndex.push(entry); else savedIndex[idx] = entry;
      importadas++;
    }
    if(!supabaseReady() && storageOk) await appStorage.set('recipes-index', JSON.stringify(savedIndex));
    statusMsg = importadas===1 ? '1 ficha importada.' : (importadas + ' fichas importadas.');
    renderAll();
  }catch(err){
    statusMsg = 'Não foi possível importar este ficheiro (formato inesperado).';
    renderSidebar();
  }
}
